name: Auto operate (live)
# Keeps the day going on the REAL horses with nobody at the screen (server/scripts/autoOperate.js): meals
# and care recorded in their time, the sessions booked now checked and started, the finished ones
# evaluated, each marked "Tự vận hành". It creates no horse and books no session, and goes past no block.
# A run lasts 25 minutes and one starts every 30, from 05:00 to 19:59 Vietnam time.
# For now it only reads and reports (OPERATE_CONFIRM below). The script stops by itself after OPERATE_UNTIL.
on:
  schedule:
    - cron: '*/30 22-23 * 10,11 *' # 05:00–06:59 Vietnam time
    - cron: '*/30 0-12 * 11 *' # 07:00–19:59 Vietnam time
  workflow_dispatch:
concurrency:
  group: auto-operate
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      # The script comes from NDuy (only Claude pushes there), so a push to main cannot change what runs.
      - uses: actions/checkout@v4
        with:
          ref: NDuy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Do what is due on the live API
        run: node server/scripts/autoOperate.js
        env:
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          OPERATE_CONFIRM: 'read'
          OPERATE_UNTIL: '2026-11-13'
          OPERATE_RUN_MIN: '25'
