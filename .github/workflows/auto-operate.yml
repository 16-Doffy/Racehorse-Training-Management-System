name: Auto operate (live)
# Keeps the day going on the REAL horses with nobody at the screen (server/scripts/autoOperate.js): meals
# and care recorded in their time, the sessions booked now checked and started, the finished ones
# evaluated, each marked "Tự vận hành". It creates no horse and books no session, and goes past no block.
# GitHub fires this repo's schedules hours late and drops many (02/11: first at 08:07, then 10:08, and four
# 07:30 sessions were missed), so a run stays on for most of the 6 hours a job may last, the next one queued
# behind it, and the schedule asks from 02:00 to be on before the first meal. Minutes 17 and 47, off the busy :00 and
# :30: asked on those, it did not run once between 10:08 and 16:30 on 02/11, while defense-data on :05/:10/:35 did.
# The script stops by itself after OPERATE_UNTIL. The four horses of defense-data work (defenseData.js) need
# their breakfasts left for it, so they are left alone until OPERATE_SKIP_UNTIL.
on:
  schedule:
    - cron: '17,47 19-21 * 11 *' # 02:00–04:59 Vietnam time
    - cron: '17,47 22-23 * 10,11 *' # 05:00–06:59 Vietnam time
    - cron: '17,47 0-16 * 11 *' # 07:00–23:59 Vietnam time
  workflow_dispatch:
concurrency:
  group: auto-operate
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      # The script comes from NDuy (only Claude pushes there), so a push to main cannot change what runs.
      - uses: actions/checkout@v4
        with:
          ref: NDuy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Do what is due on the live API
        run: node server/scripts/autoOperate.js
        env:
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          OPERATE_CONFIRM: 'write'
          OPERATE_UNTIL: '2026-11-13'
          OPERATE_RUN_MIN: '340'
          OPERATE_SKIP: 'Orion,Pegasus,Demo · Sẵn sàng tập,Demo · Diễn tập chấn thương'
          OPERATE_SKIP_UNTIL: '2026-11-12'
