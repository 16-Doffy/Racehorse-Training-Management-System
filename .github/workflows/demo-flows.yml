name: Demo flows (live)
# Demo rounds on the REAL club database (server/scripts/demoFlows.js). Each round: two new
# "Test Demo" horses through every role — one fed, scheduled, trained to "Đạt mục tiêu" and
# evaluated; one whose breakfast was missed, refused, fed late, stopped early ("Chưa đạt") and sent to
# the vet. A round starts every 45 minutes from 05:00 until 08:00 (5 rounds); each one waits the
# club's 90-minute digestion time, so the last finishes before 10:00. Runs once on the demo morning
# and from the "Run workflow" button. Remove the schedule after the demo.
on:
  schedule:
    - cron: '0 22 15 10 *' # 05:00 Vietnam time on 16/10 (22:00 UTC on 15/10)
  workflow_dispatch:
concurrency:
  group: demo-flows
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      # GitHub runs schedules from main, but the script comes from NDuy (only Claude pushes there), so a
      # teammate's push to main during the morning cannot change what runs. The server itself still
      # deploys from main.
      - uses: actions/checkout@v4
        with:
          ref: NDuy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the demo rounds on the live API
        run: node server/scripts/demoFlows.js
        env:
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          DEMO_CONFIRM: write
          DEMO_ROUND_EVERY_MIN: 45
          DEMO_LAST_START: '08:00'
          # The cron fires every 15/10; only the 2026 demo morning writes. The button always runs.
          DEMO_ONLY_DATE: ${{ github.event_name == 'schedule' && '2026-10-16' || '' }}
