name: Demo flows (live)
# Demo rounds on the REAL club database (server/scripts/demoFlows.js). Each round: new "Test Demo"
# horses through every role, each a different case — one fed, trained to "Đạt mục tiêu", evaluated,
# then trial-run and confirmed for the demo race; one whose breakfast was missed, refused, fed late,
# stopped early ("Chưa đạt") and sent to the vet; in round 1 one that goes lame, is found injured and is
# withdrawn from the race. A round starts at once and another every 45 minutes until 07:30 (four rounds
# from 05:00, the last done by about 10:00, each one waiting the 90-minute digestion time). The next
# day is race day: the trainer records the race's results. A second trigger each morning covers a late
# or dropped schedule (GitHub delayed the 16/10 run by two hours); it stops when the work is done.
# Remove the schedule after the demo.
on:
  schedule:
    - cron: '0 22 22 10 *' # 05:00 Vietnam time on 23/10 (demo morning): the rounds
    - cron: '30 23 22 10 *' # 06:30 on 23/10: backup, skipped once round 1 exists
  workflow_dispatch:
    inputs:
      mode:
        description: 'flows: các lượt ngựa (buổi sáng) · results: nhập kết quả giải đua hôm nay'
        type: choice
        options: [flows, results]
        default: flows
concurrency:
  group: demo-flows
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      # GitHub runs schedules from main, but the script comes from NDuy (only Claude pushes there), so a
      # teammate's push to main during the morning cannot change what runs. The server itself still
      # deploys from main.
      - uses: actions/checkout@v4
        with:
          ref: NDuy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the demo rounds (or race day) on the live API
        run: node server/scripts/demoFlows.js
        env:
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          DEMO_CONFIRM: write
          DEMO_ROUND_EVERY_MIN: 45
          DEMO_LAST_START: '07:30'
          # The crons fire every year on these dates; only 2026 writes. The button runs what it is told.
          DEMO_ONLY_DATE: ${{ github.event_name == 'schedule' && '2026-10-23' || '' }}
          # No race-day run is scheduled this time: the rounds' race (24/10) is recorded by hand if needed.
          DEMO_RESULT_DATE: ''
          DEMO_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
