name: Test
on:
  push:
  pull_request:
  # Every morning at 06:45 Vietnam time (23:45 UTC), on main, so the time-of-day rules (meal slots,
  # afternoon light work, pre-check windows) are exercised at a real morning hour. GitHub may start
  # a scheduled run a few minutes late.
  schedule:
    - cron: '45 23 * * *'
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:
jobs:
  verify:
    # Pinned: ubuntu-latest started moving to Ubuntu 26 on 19/10/2026 and the MongoDB replica set step failed there.
    runs-on: ubuntu-24.04
    # 54 browser tests take most of 15 minutes, and the browser install alone once took 9 (26/10): room for both.
    timeout-minutes: 30
    env:
      TZ: Asia/Ho_Chi_Minh
      TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=wdp301Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated MongoDB replica set
        run: |
          # On some runners the mongo:8.0 container dies at start (it never answered, while good runs take
          # ~15 s): check that it is alive, print why it stopped, and fall back to mongo:7.0 (replica set and
          # transactions are all the tests need). Pulls retry, then use Google's mirror of Docker Hub.
          pull() {
            for i in 1 2 3; do docker pull -q "$1" >/dev/null && { echo "$1"; return 0; }; sleep $((i * 10)); done
            docker pull -q "mirror.gcr.io/library/$1" >/dev/null && echo "mirror.gcr.io/library/$1"
          }
          start() {
            docker rm -f wdp301-test-mongo >/dev/null 2>&1 || true
            image=$(pull "$1") || return 1
            echo "starting $image"
            docker run -d --name wdp301-test-mongo -p 27018:27018 "$image" mongod --port 27018 --replSet wdp301Test --bind_ip_all >/dev/null || return 1
            for i in $(seq 1 45); do
              if [ "$(docker inspect -f '{{.State.Running}}' wdp301-test-mongo 2>/dev/null)" != "true" ]; then echo "$image stopped:"; docker logs --tail 40 wdp301-test-mongo; return 1; fi
              docker exec wdp301-test-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break
              sleep 1
            done
            # A slow runner can take a while to elect the single member: initiate again if it did not take.
            for attempt in 1 2 3; do
              docker exec wdp301-test-mongo mongosh --port 27018 --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"wdp301Test",members:[{_id:0,host:"127.0.0.1:27018"}]}) }' >/dev/null 2>&1 || true
              for i in $(seq 1 30); do
                docker exec wdp301-test-mongo mongosh --port 27018 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1 && { echo "$image is primary"; return 0; }
                sleep 1
              done
            done
            echo "$image did not become primary:"; docker logs --tail 40 wdp301-test-mongo; return 1
          }
          start mongo:8.0 || start mongo:7.0
      - name: Backend unit tests
        run: env -u TEST_MONGO_URI npm run test:server
      - run: npm run test:mobile
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run lint -w client
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: scratch/playwright-results
          if-no-files-found: ignore
  # Read-only check of the deployed API (server/scripts/liveSmoke.js). Only on the schedule or the
  # button, not on every push. It signs in when the repository secrets LIVE_MANAGER_EMAIL and
  # LIVE_MANAGER_PASSWORD are set; without them it only wakes the server and checks health.
  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only check of the live API
        run: node server/scripts/liveSmoke.js
        env:
          LIVE_MANAGER_EMAIL: ${{ secrets.LIVE_MANAGER_EMAIL }}
          LIVE_MANAGER_PASSWORD: ${{ secrets.LIVE_MANAGER_PASSWORD }}
