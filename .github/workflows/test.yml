name: Test
on:
  push:
  pull_request:
  # Every morning at 06:45 Vietnam time (23:45 UTC), on main, so the time-of-day rules (meal slots,
  # afternoon light work, pre-check windows) are exercised at a real morning hour. GitHub may start
  # a scheduled run a few minutes late.
  schedule:
    - cron: '45 23 * * *'
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
      TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=wdp301Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name wdp301-test-mongo -p 27018:27018 mongo:8.0 mongod --port 27018 --replSet wdp301Test --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec wdp301-test-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec wdp301-test-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"wdp301Test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for i in $(seq 1 30); do
            if docker exec wdp301-test-mongo mongosh --port 27018 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Backend unit tests
        run: env -u TEST_MONGO_URI npm run test:server
      - run: npm run test:mobile
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run lint -w client
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: scratch/playwright-results
          if-no-files-found: ignore
  # Read-only check of the deployed API (server/scripts/liveSmoke.js). Only on the schedule or the
  # button, not on every push. It signs in when the repository secrets LIVE_MANAGER_EMAIL and
  # LIVE_MANAGER_PASSWORD are set; without them it only wakes the server and checks health.
  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only check of the live API
        run: node server/scripts/liveSmoke.js
        env:
          LIVE_MANAGER_EMAIL: ${{ secrets.LIVE_MANAGER_EMAIL }}
          LIVE_MANAGER_PASSWORD: ${{ secrets.LIVE_MANAGER_PASSWORD }}
