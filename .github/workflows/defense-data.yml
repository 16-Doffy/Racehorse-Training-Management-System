name: Defense data (live)
# Daily 3-shift live auto-test on the REAL site (server/scripts/defenseData.js): 05:00, 11:00, 16:00 Vietnam time.
# Four test horses (Orion, Pegasus, "Demo · Sẵn sàng tập", "Demo · Diễn tập chấn thương") rotate through all
# roles and edge cases every week; real horses stay untouched here and are managed by auto-operate.yml.
# Each shift reads the clock, waits until its window, and runs its cases; once a shift begins it dispatches the
# next one itself via workflow_dispatch (server/scripts/defenseClock.js):
#   morning 05:00 → noon 11:00 → evening 16:00 → daily report → night relay (02:00) → morning 05:00.
# The schedules below stay as fallbacks in case a relay or manual run breaks the chain.
# A run shown as cancelled with no steps was only replaced in the queue. Read each run's Summary for its report.
on:
  schedule:
    - cron: '5 19 * * *' # 02:05 Vietnam time, asking for the morning shift (05:00)
    - cron: '35 19 * * *'
    - cron: '5 20 * * *'
    - cron: '35 20 * * *'
    - cron: '5 21 * * *'
    - cron: '35 21 * * *'
    - cron: '5 22 * * *'
    - cron: '35 22 * * *'
    - cron: '10 1 * * *' # 08:10, asking for the noon shift (11:00)
    - cron: '10 2 * * *'
    - cron: '10 3 * * *'
    - cron: '10 4 * * *'
    - cron: '10 6 * * *' # 13:10, asking for the evening shift (16:00)
    - cron: '10 7 * * *'
    - cron: '10 8 * * *'
    - cron: '10 9 * * *'
    - cron: '40 15 * * *' # 22:40, the day's report
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      shift:
        description: 'morning, noon, evening, report hoặc relay; để trống thì theo đồng hồ'
        required: false
        default: ''
        type: string
# actions: write lets a run ask for the next one with its own token.
permissions:
  contents: read
  actions: write
concurrency:
  group: defense-data
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    # A shift run is 05:00–10:50 or 16:00–21:50 after starting a minute early; a job may last 6 hours.
    timeout-minutes: 360
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      # The script comes from NDuy (only Claude pushes there), so a push to main cannot change what runs.
      - uses: actions/checkout@v4
        with:
          ref: NDuy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run this shift on the live API
        id: shift
        run: node server/scripts/defenseData.js
        env:
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          DEFENSE_CONFIRM: 'write'
          DEFENSE_SHIFT: ${{ inputs.shift }}
      # A run started by workflow_dispatch with this token is the one kind GitHub starts at once. The script says
      # which run comes next and after how long; a shift found already begun says nothing, so runs never loop.
      - name: Ask for the next run
        if: ${{ !cancelled() && steps.shift.outputs.next != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.shift.outputs.next }}
          WAIT: ${{ steps.shift.outputs.wait }}
        run: |
          echo "Gọi lượt ${NEXT} sau ${WAIT:-0} giây."
          sleep "${WAIT:-0}"
          gh workflow run defense-data.yml --repo "$GITHUB_REPOSITORY" --ref main -f shift="$NEXT"
